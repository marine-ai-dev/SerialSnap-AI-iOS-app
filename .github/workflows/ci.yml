name: CI

# Runs on every push and pull request to any branch.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Discover which local Swift packages currently exist under Packages/*
  # so the build/test job can fan out over exactly what's there, without
  # hardcoding a package list that will drift as packages are added.
  # ---------------------------------------------------------------------
  discover-packages:
    runs-on: macos-14
    outputs:
      portable_packages: ${{ steps.list.outputs.portable_packages }}
      has_portable_packages: ${{ steps.list.outputs.has_portable_packages }}
      ios_only_packages: ${{ steps.list.outputs.ios_only_packages }}
      has_ios_only_packages: ${{ steps.list.outputs.has_ios_only_packages }}
    steps:
      - uses: actions/checkout@v4

      - name: List Swift packages, split by platform support
        id: list
        run: |
          set -euo pipefail
          # A package that declares .macOS(...) in its Package.swift is
          # buildable/testable natively on the macOS runner with plain
          # `swift build`/`swift test`. A package that declares iOS only
          # (it depends on UIKit/AVFoundation/Vision/SwiftUI-for-iOS) cannot
          # be built as a native macOS binary — plain `swift build` on this
          # runner resolves the *host* (macOS) platform, which is a
          # different build than the iOS one this app actually ships, and
          # fails outright for packages with no macOS platform declared at
          # all. Those must be built for the iOS Simulator destination via
          # xcodebuild instead, so keep the two groups separate.
          portable=()
          ios_only=()
          if compgen -G "Packages/*/Package.swift" > /dev/null; then
            for pkg in Packages/*/Package.swift; do
              dir="$(dirname "$pkg")"
              if grep -q '\.macOS(' "$pkg"; then
                portable+=("\"$dir\"")
              else
                ios_only+=("\"$dir\"")
              fi
            done
          fi
          portable_matrix="[$(IFS=,; echo "${portable[*]:-}")]"
          ios_only_matrix="[$(IFS=,; echo "${ios_only[*]:-}")]"
          echo "portable_packages=$portable_matrix" >> "$GITHUB_OUTPUT"
          echo "ios_only_packages=$ios_only_matrix" >> "$GITHUB_OUTPUT"
          [ "$portable_matrix" = "[]" ] && echo "has_portable_packages=false" >> "$GITHUB_OUTPUT" || echo "has_portable_packages=true" >> "$GITHUB_OUTPUT"
          [ "$ios_only_matrix" = "[]" ] && echo "has_ios_only_packages=false" >> "$GITHUB_OUTPUT" || echo "has_ios_only_packages=true" >> "$GITHUB_OUTPUT"
          echo "Portable (macOS+iOS) packages: $portable_matrix"
          echo "iOS-only packages: $ios_only_matrix"

  # ---------------------------------------------------------------------
  # Build & test packages that declare macOS support (pure-Swift domain/
  # parsing/export/sync logic) natively with `swift build`/`swift test`.
  # ---------------------------------------------------------------------
  build-and-test-portable:
    needs: discover-packages
    if: needs.discover-packages.outputs.has_portable_packages == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.portable_packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: swift build (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: swift build

      - name: swift test (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if compgen -G "Tests/*" > /dev/null 2>&1; then
            swift test
          else
            echo "No Tests/ directory in ${{ matrix.package }} — nothing to run."
          fi

  # ---------------------------------------------------------------------
  # Build iOS-only packages (UIKit/AVFoundation/Vision/SwiftUI-for-iOS)
  # for the iOS Simulator destination via xcodebuild, since a plain
  # `swift build` on the macOS runner would try to build them as native
  # macOS binaries, which they were never declared to support.
  # ---------------------------------------------------------------------
  build-ios-only:
    needs: discover-packages
    if: needs.discover-packages.outputs.has_ios_only_packages == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.ios_only_packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List available iOS simulators
        run: xcrun simctl list devicetypes | head -30

      - name: xcodebuild (${{ matrix.package }}) for iOS Simulator
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          scheme="$(basename "$PWD")"
          xcodebuild build \
            -scheme "$scheme" \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation

  # ---------------------------------------------------------------------
  # Lint. Runs SwiftLint if a config is present anywhere in the repo;
  # otherwise this job succeeds trivially rather than failing CI.
  # ---------------------------------------------------------------------
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check for SwiftLint configuration
        id: config
        run: |
          if [ -f ".swiftlint.yml" ] || [ -f ".swiftlint.yaml" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SwiftLint
        if: steps.config.outputs.found == 'true'
        run: brew install swiftlint

      - name: Run SwiftLint
        if: steps.config.outputs.found == 'true'
        run: swiftlint lint --strict

      - name: Skip (no SwiftLint config found)
        if: steps.config.outputs.found == 'false'
        run: echo "No .swiftlint.yml/.swiftlint.yaml found — skipping lint without failing the build."

  # ---------------------------------------------------------------------
  # Validate Supabase SQL migrations against an ephemeral local Postgres
  # container. No real Supabase project or secrets are required or used.
  # ---------------------------------------------------------------------
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if compgen -G "supabase/migrations/*.sql" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql client
        if: steps.check.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        if: steps.check.outputs.found == 'true'
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Apply local auth schema shim (stands in for Supabase's auth.users/auth.uid())
        if: steps.check.outputs.found == 'true'
        run: |
          set -euo pipefail
          if [ -f supabase/tests/00_local_test_shim.sql ]; then
            psql -v ON_ERROR_STOP=1 -f supabase/tests/00_local_test_shim.sql
          fi

      - name: Apply migrations in order against ephemeral Postgres
        if: steps.check.outputs.found == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Run RLS isolation test suite
        if: steps.check.outputs.found == 'true'
        run: |
          set -euo pipefail
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            for f in $(ls supabase/tests/*.sql | sort); do
              base=$(basename "$f")
              if [ "$base" = "00_local_test_shim.sql" ]; then continue; fi
              echo "::group::Running $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
              echo "::endgroup::"
            done
          fi

      - name: Skip (no migrations found yet)
        if: steps.check.outputs.found == 'false'
        run: echo "No supabase/migrations/*.sql found — skipping migration validation."
